<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Solo Hiking </title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #fff; color: #222; }
    h1 { text-align: center; }

    /* Masonry-style layout: keeps each photo's natural shape */
    .gallery { columns: 3 300px; column-gap: 16px; }

    figure { margin: 0 0 16px; break-inside: avoid; }
    figure img { width: 100%; height: auto; display: block; border-radius: 6px; }
    figcaption { font-size: 14px; color: #555; padding: 6px 2px 0; }
  </style>
</head>
<body>
  <h1>My Photo Gallery</h1>
  <div class="gallery">

    <figure>
    <a href="Wedgemount_glacier_ducks.jpeg"><img src="Wedgemount_glacier_ducks.jpeg" alt="Wedgemount"></a>
      <figcaption>Sunset at the beach, July 2026</figcaption>
    </figure>
  </div>
</body>
</html>
