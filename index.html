<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Solo Hiking </title>
  <style>

  nav { position: fixed; top: 0; left: 0; width: 200px; height: 100%; overflow-y: auto;
      padding: 20px; box-sizing: border-box; border-right: 1px solid #ddd; background: #fff; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav ul ul { padding-left: 16px; }          /* indents locations under months */
  nav a { display: block; padding: 4px 0; color: #0066cc; text-decoration: none; }

  /* Push page content to the right of the sidebar */
  main { margin-left: 200px; }

  /* On phones, put the menu on top instead */
  @media (max-width: 700px) {
    nav { position: static; width: auto; height: auto; border-right: none; border-bottom: 1px solid #ddd; }
    main { margin-left: 0; }
  }
  
  body { font-family: sans-serif; margin: 0; padding: 20px; background: #fff; color: #222; }
  h1 { text-align: center; }
  h2 { text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin: 50px 0 24px; }
  h3 { text-align: center; color: #444; margin: 30px 0 16px; }
  .gallery { display: flex; flex-direction: column; align-items: center; gap: 32px; }

  figure { margin: 0; max-width: 100%; overflow-x: auto; }
  figure img { width: 1200px; height: auto; max-width: none; display: block; }
  figcaption { font-size: 14px; color: #555; padding: 6px 2px 0; }
  </style>
</head>
<body>
  <h1> Solo Hiking </h1>
  <nav>
  <ul>
    <li><a href="#2026-08">August 2026</a>
      <ul>
        <li><a href="#2026-08-tokyo">Tokyo</a></li>
      </ul>
    </li>
    <li><a href="#2026-07">July 2026</a>
      <ul>
        <li><a href="#2026-07-paris">Paris</a></li>
        <li><a href="#2026-07-lyon">Lyon</a></li>
      </ul>
    </li>
  </ul>
</nav>
  <section id="2026-07">
  <h2>July 2026</h2>

  <section id="2026-07-paris">
    <h3>Paris</h3>
    <div class="gallery">
      <figure>
    <a href="Wedgemount_glacier_ducks.jpeg"><img src="Wedgemount_glacier_ducks.jpeg" alt="Wedgemount"></a>
      <figcaption> Wedgemount glacier ducks, August 2026 </figcaption>
    </figure>
    </div>
  </section>

  <section id="2026-07-lyon">
    <h3>Lyon</h3>
    <div class="gallery">
    <figure>
    <a href="Wedgemount_glacier_ducks.jpeg"><img src="Wedgemount_glacier_ducks.jpeg" alt="Wedgemount"></a>
      <figcaption> Wedgemount glacier ducks, August 2026 </figcaption>
    </figure>
    </div>
  </section>
</body>
</html>
