<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Photos</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #fff; color: #222; }
    h1 { text-align: center; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
    .gallery img { width: 100%; height: 250px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>My Photo Gallery</h1>
  <div class="gallery">
    <a href="Wedgemount_glacier_ducks.jpeg"><img src="Wedgemount_glacier_ducks.jpeg" alt="Wedgemount"></a>
  </div>
</body>
</html>
